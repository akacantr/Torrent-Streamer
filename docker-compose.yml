services:
  torrent-streamer:
    build: .
    container_name: torrent-streamer
    restart: unless-stopped
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    ports:
      - "${HOST_PORT:-8088}:8080"
    volumes:
      - ./.torrent-cache:/app/.torrent-cache

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: torrent-streamer-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - torrent-streamer
